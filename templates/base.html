<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Suporte Técnico{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="{{ url_for('index') }}">🛠 Suporte Técnico</a>
    <nav><a href="{{ url_for('index') }}">Chamados</a><a class="btn small" href="{{ url_for('novo_chamado') }}">+ Novo chamado</a></nav>
  </div>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer><div class="container">Projeto acadêmico • Desenvolvimento de Sistemas</div></footer>
</body>
</html>
